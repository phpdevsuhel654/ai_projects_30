{% extends "base.html" %}

{% block title %}Manage Categories{% endblock %}

{% block content %}
<h1 class="h3 mb-3">FAQ Categories</h1>
<form method="post" class="card card-body mb-3">
    <div class="row g-2">
        <div class="col-md-4"><input class="form-control" name="name" placeholder="Category name" required></div>
        <div class="col-md-6"><input class="form-control" name="description" placeholder="Description"></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
    </div>
</form>

<table class="table table-striped">
    <thead><tr><th>Name</th><th>Description</th><th>Action</th></tr></thead>
    <tbody>
    {% for c in categories %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.description or '-' }}</td>
            <td>
                <form method="post" action="{{ url_for('admin.delete_category', category_id=c.id) }}">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="3" class="text-muted">No categories yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}

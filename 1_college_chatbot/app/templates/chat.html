{% extends "base.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">College Enquiry Assistant (Phase 1)</h2>
            </div>
            <div class="card-body">
                <div id="chat-box" class="chat-box mb-3" aria-live="polite"></div>
                <form id="chat-form" class="d-flex gap-2">
                    <input id="message" class="form-control" placeholder="Ask about admissions, fees, hostel..." required>
                    <button class="btn btn-primary" type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const box = document.getElementById("chat-box");

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = role === "user" ? "text-end mb-2" : "text-start mb-2";
  row.innerHTML = `<span class="badge ${role === "user" ? "bg-primary" : "bg-secondary"}">${role}</span> <span>${text}</span>`;
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";

  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, session_id: "browser-session" })
  });

  const data = await response.json();
  addMessage("bot", data.response || "No response");
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="h4 mb-3">User Profile</h2>
        <form method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="full_name">Full Name</label>
                <input class="form-control" type="text" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" value="{{ current_user.email }}" required>
            </div>
            <button class="btn btn-primary" type="submit">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}

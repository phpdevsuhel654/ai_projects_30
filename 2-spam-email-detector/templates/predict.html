{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="card-title">Predict Email Class</h1>
        <div class="alert alert-info" role="alert">
          Enter an email message to classify it as spam or ham.
        </div>
        <form method="post" action="/predict">
          <div class="mb-3">
            <label for="message" class="form-label">Email Content</label>
            <textarea class="form-control" id="message" name="message" rows="6" placeholder="Paste an email message here..."></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Classify</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login | Utility Hub{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-3">Sign In</h1>
        <p class="text-muted small mb-4">Authentication is enabled for this environment.</p>
        <form method="post" action="{{ url_for('web.login_submit', next=request.args.get('next')) }}" class="row g-3">
          <div class="col-12">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" autocomplete="username" required />
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" autocomplete="current-password" required />
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

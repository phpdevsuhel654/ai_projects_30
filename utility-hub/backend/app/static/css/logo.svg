<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
  <!-- Clock circle -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="#1f1f1f" stroke-width="2"/>
  
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2" fill="#1f1f1f"/>
  
  <!-- Hour hand -->
  <line x1="24" y1="24" x2="24" y2="12" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Minute hand -->
  <line x1="24" y1="24" x2="32" y2="24" stroke="#1f1f1f" stroke-width="2" stroke-linecap="round"/>
</svg>
